name: Generate GitHub Analytics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      # ─────────────────────────────────────────
      # GitHub Stats
      # ─────────────────────────────────────────

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=anyasinha&show_icons=true&hide_border=true&bg_color=00000000&title_color=EF93C4&icon_color=FF69B4&text_color=888888&ring_color=F8BBD0
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # Top Languages
      # ─────────────────────────────────────────

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=anyasinha&layout=compact&langs_count=8&hide_border=true&bg_color=00000000&title_color=EF93C4&text_color=888888
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # GitHub Streak
      # ─────────────────────────────────────────

      - name: Generate GitHub Streak
        run: |
          curl -fL \
            "https://streak-stats.demolab.com?user=anyasinha&theme=transparent&hide_border=true&ring=FF69B4&fire=FF69B4&currStreakLabel=EF93C4&sideLabels=EF93C4&dates=888888&currStreakNum=FF69B4&sideNums=EF93C4" \
            -o assets/streak.svg

      # ─────────────────────────────────────────
      # Contribution Activity Graph
      # ─────────────────────────────────────────

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: anyasinha
          options: "bg_color=00000000&color=EF93C4&line=FF69B4&point=F8BBD0&area=true&area_color=EF93C4&hide_border=true&custom_title=Anya%27s%20Contribution%20Graph"
          output_path: assets/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────
      # Verify generated files
      # ─────────────────────────────────────────

      - name: Verify generated files
        run: |
          echo "Generated analytics files:"
          ls -lh assets/

          echo ""
          echo "File information:"
          file assets/*.svg

      # ─────────────────────────────────────────
      # Commit updated analytics
      # ─────────────────────────────────────────

      - name: Commit generated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub analytics"
            git push
          fi
